<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor Peta Kampus UNSRAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logo-unsrat.png">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="logo" src="assets/logo-unsrat.png" alt="Lambang Universitas Sam Ratulangi">
        <div>
          <h1>Editor penamaan</h1>
          <p>Satu nama boleh dipakai di beberapa poligon</p>
        </div>
      </div>
      <p class="meta" id="status">Memuat…</p>
      <div class="list" id="list"></div>
      <p class="foot">
        Klik poligon kuning, lalu pilih nama gedung.
        Nama yang sama boleh dipasang di lebih dari satu poligon.
        <a href="index.html">Lihat peta publik</a>
      </p>
      <form class="logout" method="post" action="/logout">
        <button type="submit">Keluar</button>
      </form>
    </aside>
    <main class="stage" id="stage">
      <div class="toolbar">
        <button class="btn is-on" id="btn-select" type="button">Pilih</button>
        <button class="btn" id="btn-draw" type="button">Gambar poligon</button>
        <button class="btn btn-danger" id="btn-delete" type="button">Hapus poligon</button>
        <button class="btn btn-gold" id="btn-save" type="button">Simpan</button>
        <button class="btn" id="btn-download" type="button">Unduh JSON</button>
        <button class="btn btn-ghost" id="btn-reset" type="button">Reset draf</button>
      </div>
      <div class="panel" id="panel">
        <h2>Gedung terpilih</h2>
        <p class="meta" id="selected-id">Klik salah satu poligon.</p>
        <label for="name-select">Nama resmi</label>
        <select id="name-select">
          <option value="">Belum dinamai</option>
        </select>
        <div class="row">
          <button class="btn" id="btn-clear-name" type="button">Hapus nama</button>
        </div>
      </div>
      <div class="hint" id="hint">Poligon kuning = draf atap utama. Isi namanya dari daftar.</div>
      <div id="map"></div>
    </main>
  </div>
  <script src="vendor/leaflet.js"></script>
  <script src="js/map.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
